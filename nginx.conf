server {
    listen 80;
    server_name ondrasounds.duckdns.org;
    root /usr/share/nginx/html;
    index index.html;

    # =========================
    # Gzip compression
    # =========================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/javascript application/json;

    # =========================
    # Security headers
    # =========================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # =========================
    # Cache static assets
    # =========================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache config.js for 5 minutes
    location /assets/config.js {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    # =========================
    # REVERSE PROXY - API MICROSERVICES
    # =========================
    # IMPORTANTE: Las rutas más específicas deben ir primero

    # Microservicio de Recomendaciones - Endpoints específicos (van PRIMERO)
    location ~ ^/api/(usuarios/recomendaciones|artistas/recomendaciones|usuarios/[0-9]+/preferencias) {
        proxy_pass http://recomendaciones:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Microservicio de Usuarios - Endpoints
    location ~ ^/api/(usuarios|artistas|seguimientos|config|public) {
        proxy_pass http://usuarios:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Microservicio de Contenidos - Endpoints
    location ~ ^/api/(generos|multimedia|canciones|albumes|cobros|favoritos|compras|comentarios|valoraciones|carrito) {
        proxy_pass http://contenidos:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # =========================
    # ANGULAR FRONTEND
    # =========================

    # Angular routes - fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}